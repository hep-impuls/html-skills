<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🃏 Vokabeltrainer — Lohn & Budget</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root[data-theme="dark"]{--bg-primary:#0f172a;--bg-secondary:#1e293b;--bg-card:#334155;--text-primary:#f1f5f9;--text-secondary:#94a3b8;--border:#475569;}
  :root[data-theme="light"]{--bg-primary:#f8fafc;--bg-secondary:#ffffff;--bg-card:#f1f5f9;--text-primary:#1e293b;--text-secondary:#64748b;--border:#e2e8f0;}
  :root{--accent:#10b981;--accent-2:#06b6d4;--green:#4ade80;--red:#f87171;--yellow:#fbbf24;--radius:12px;--radius-lg:20px;--transition:0.2s ease;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Lexend',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;}
  .header{background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .header-title{font-size:1rem;font-weight:700;}
  .header-sub{font-size:0.75rem;color:var(--text-secondary);margin-top:2px;}
  .header-right{display:flex;align-items:center;gap:10px;}
  .btn-sm{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:6px 14px;font-size:0.82rem;font-weight:600;color:var(--text-primary);cursor:pointer;font-family:inherit;transition:all var(--transition);}
  .btn-sm:hover{border-color:var(--accent);color:var(--accent);}
  .score-badge{background:color-mix(in srgb,var(--accent) 15%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:99px;padding:4px 12px;font-size:0.8rem;font-weight:700;color:var(--accent);}
  .round-bar{background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:0;}
  .round-step{display:flex;align-items:center;gap:0;}
  .round-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;background:var(--bg-card);border:2px solid var(--border);color:var(--text-secondary);transition:all 0.3s;}
  .round-dot.active{background:var(--accent);border-color:var(--accent);color:white;}
  .round-dot.done{background:color-mix(in srgb,var(--green) 20%,transparent);border-color:var(--green);color:var(--green);}
  .round-label{font-size:0.72rem;color:var(--text-secondary);margin-left:6px;margin-right:16px;}
  .round-label.active{color:var(--text-primary);font-weight:600;}
  .round-connector{width:24px;height:2px;background:var(--border);margin-right:4px;}
  .main-container{max-width:720px;margin:0 auto;padding:28px 20px 60px;}
  .card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px;animation:fadeIn 0.3s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .card-center{text-align:center;}
  .word-counter{font-size:0.78rem;color:var(--text-secondary);margin-bottom:20px;}
  .word-counter span{font-weight:700;color:var(--text-primary);}
  /* ROUND 1: FLIP CARDS */
  .vocab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px;}
  @media(max-width:600px){.vocab-grid{grid-template-columns:repeat(2,1fr);}}
  .vocab-card{perspective:800px;cursor:pointer;}
  .vocab-card-inner{position:relative;width:100%;transform-style:preserve-3d;transition:transform 0.55s cubic-bezier(.4,0,.2,1);border-radius:var(--radius-lg);}
  .vocab-card.flipped .vocab-card-inner{transform:rotateY(180deg);}
  .vocab-front{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius-lg);padding:20px 14px 18px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;backface-visibility:hidden;transition:border-color var(--transition);}
  .vocab-card:hover .vocab-front{border-color:var(--accent);}
  .vocab-back{position:absolute;inset:0;background:color-mix(in srgb,var(--accent) 10%,var(--bg-secondary));border:2px solid var(--accent);border-radius:var(--radius-lg);padding:16px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;backface-visibility:hidden;transform:rotateY(180deg);}
  .vocab-emoji{font-size:1.8rem;margin-bottom:8px;}
  .vocab-word{font-size:0.92rem;font-weight:700;line-height:1.3;}
  .vocab-translation{font-size:0.82rem;font-weight:700;color:var(--accent);margin-bottom:6px;}
  .vocab-example{font-size:0.73rem;color:var(--text-secondary);line-height:1.4;font-style:italic;}
  .flip-hint{font-size:0.72rem;color:var(--text-secondary);margin-top:8px;}
  /* ROUND 2: MC */
  .mc-card{margin-bottom:0;}
  .mc-word{font-size:2rem;font-weight:700;text-align:center;margin-bottom:6px;}
  .mc-emoji{font-size:2rem;text-align:center;display:block;margin-bottom:4px;}
  .mc-question{font-size:0.9rem;color:var(--text-secondary);text-align:center;margin-bottom:20px;}
  .mc-choices{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
  .mc-btn{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius);padding:12px 16px;text-align:left;font-family:inherit;font-size:0.88rem;color:var(--text-primary);cursor:pointer;transition:all var(--transition);}
  .mc-btn:hover:not(:disabled){border-color:var(--accent);}
  .mc-btn.correct{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,transparent);color:var(--green);}
  .mc-btn.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);}
  .mc-btn:disabled{cursor:not-allowed;}
  .mc-feedback{font-size:0.85rem;font-weight:600;text-align:center;padding:10px;border-radius:var(--radius);margin-bottom:12px;}
  .mc-feedback.c{color:var(--green);}
  .mc-feedback.w{color:var(--red);}
  /* ROUND 3: TYPING */
  .typing-word{font-size:2.2rem;font-weight:700;text-align:center;margin-bottom:4px;}
  .typing-emoji{font-size:2rem;text-align:center;display:block;margin-bottom:4px;}
  .typing-example{font-size:0.82rem;color:var(--text-secondary);text-align:center;font-style:italic;margin-bottom:18px;}
  .typing-input{width:100%;background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius);padding:14px;color:var(--text-primary);font-family:inherit;font-size:1.1rem;text-align:center;font-weight:600;transition:border-color var(--transition);margin-bottom:10px;}
  .typing-input:focus{outline:none;border-color:var(--accent);}
  .typing-input.correct{border-color:var(--green);}
  .typing-input.wrong{border-color:var(--red);}
  .typing-input.close{border-color:var(--yellow);}
  .typing-feedback{font-size:0.85rem;font-weight:600;text-align:center;min-height:22px;margin-bottom:8px;}
  /* BUTTONS */
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;border-radius:var(--radius);padding:12px 28px;font-size:0.95rem;font-weight:700;color:white;cursor:pointer;font-family:inherit;transition:all var(--transition);}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent);}
  .btn-secondary{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:11px 22px;font-size:0.9rem;font-weight:600;color:var(--text-primary);cursor:pointer;font-family:inherit;transition:all var(--transition);}
  .btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px;}
  /* RESULTS */
  .results-emoji{font-size:3rem;text-align:center;display:block;margin-bottom:12px;}
  .results-score{font-size:1.3rem;font-weight:700;text-align:center;margin-bottom:8px;}
  .results-sub{font-size:0.88rem;color:var(--text-secondary);text-align:center;margin-bottom:24px;}
  #printContent{display:none;}
  @media print{body>*:not(#printContent){display:none!important;}#printContent{display:block!important;}}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">🃏 Vokabeltrainer — Lohn & Budget</div>
    <div class="header-sub">ABU · Wirtschaft & Gesellschaft</div>
  </div>
  <div class="header-right">
    <span class="score-badge" id="scoreBadge">0 Pkt</span>
    <button class="btn-sm" onclick="printSummary()">🖨️ Ausdruck</button>
    <button class="btn-sm" onclick="toggleTheme()"><span id="themeIcon">🌙</span></button>
  </div>
</div>

<div class="round-bar">
  <div class="round-step">
    <div class="round-dot active" id="dot0">1</div>
    <span class="round-label active" id="lbl0">Karten lernen</span>
  </div>
  <div class="round-connector"></div>
  <div class="round-step">
    <div class="round-dot" id="dot1">2</div>
    <span class="round-label" id="lbl1">Multiple Choice</span>
  </div>
  <div class="round-connector"></div>
  <div class="round-step">
    <div class="round-dot" id="dot2">3</div>
    <span class="round-label" id="lbl2">Eintippen</span>
  </div>
</div>

<div class="main-container" id="mainContainer"></div>
<div id="printContent"></div>

<script>
const VOCAB = [
  { word:'Bruttolohn', emoji:'💰', translation:'Lohn vor Abzügen (Steuern, AHV usw.)', example:'Mein Bruttolohn ist 5\'500 Franken, aber netto erhalte ich weniger.' },
  { word:'Nettolohn', emoji:'💵', translation:'Lohn nach allen Abzügen — das, was man wirklich erhält', example:'Ihr Nettolohn beträgt 3\'800 Franken im Monat.' },
  { word:'Angebot & Nachfrage', emoji:'📊', translation:'Wirtschaftsprinzip: Preis (auch Lohn) richtet sich nach Angebot und Nachfrage', example:'Wenige Fachkräfte = höherer Lohn, weil die Nachfrage das Angebot übersteigt.' },
  { word:'Produktivität', emoji:'⚙️', translation:'Mass für Leistung pro Zeiteinheit — wer mehr produziert, verdient oft mehr', example:'Arbeiter B schafft doppelt so viele Teile wie A — seine Produktivität ist höher.' },
  { word:'Mindestlohn', emoji:'🛡️', translation:'Gesetzlich oder tariflich festgelegte Lohnuntergrenze', example:'Die Initiative für einen nationalen Mindestlohn von 4\'000 Franken scheiterte.' },
  { word:'Lohnregulativ', emoji:'📋', translation:'Branchenweites Reglement, das Mindest- und Richtlöhne festlegt', example:'Laut Lohnregulativ des Gärtnerverbands verdient man nach der Lehre 4\'300 Franken.' },
  { word:'Überschuldung', emoji:'🔴', translation:'Schulden übersteigen die Möglichkeit zur Rückzahlung dauerhaft', example:'Claudia war mit 30\'000 Franken überschuldet — eine typische Überschuldungssituation.' },
  { word:'Zahlungsbefehl', emoji:'📨', translation:'Amtliches Schreiben zur Eintreibung einer Schuld', example:'Sie fürchtete sich, den Briefkasten zu öffnen, weil neue Zahlungsbefehle kamen.' },
  { word:'Gewerkschaft', emoji:'✊', translation:'Interessensvertretung der Arbeitnehmenden — verhandelt Löhne und Rechte', example:'Gewerkschaften haben im Baugewerbe höhere Löhne ausgehandelt.' },
  { word:'Sozialabzüge', emoji:'🏥', translation:'Pflichtbeiträge für AHV, IV, ALV, Krankenkasse usw.', example:'Von meinem Lohn werden Sozialabzüge für die Altersvorsorge abgezogen.' },
];
const CONFIG = { lang1:'Begriff', lang2:'Erklärung', rounds:['flip','mc','typing'] };

let round = 0, score = 0, mcIdx = 0, typIdx = 0;
let shuffled = [], mcOrder = [], typOrder = [];
let correctAnswers = {}, typingResults = [];

function fisher(arr) { let a=[...arr]; for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function levenshtein(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++){d[i]=[i];}for(let j=0;j<=n;j++){d[0][j]=j;}for(let i=1;i<=m;i++){for(let j=1;j<=n;j++){d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]:1+Math.min(d[i-1][j],d[i][j-1],d[i-1][j-1]);}}return d[m][n];}

function updateScore(pts) { score += pts; document.getElementById('scoreBadge').textContent = score + ' Pkt'; }
function updateRoundDots() {
  [0,1,2].forEach(i => {
    document.getElementById('dot'+i).className = 'round-dot' + (i < round ? ' done' : i === round ? ' active' : '');
    document.getElementById('lbl'+i).className = 'round-label' + (i === round ? ' active' : '');
  });
}

function startRound0() {
  round = 0; shuffled = fisher(VOCAB); updateRoundDots();
  const c = document.getElementById('mainContainer');
  let gridHTML = shuffled.map((v,i) => `
    <div class="vocab-card" id="vc${i}" onclick="this.classList.toggle('flipped')">
      <div class="vocab-card-inner">
        <div class="vocab-front"><div class="vocab-emoji">${v.emoji}</div><div class="vocab-word">${v.word}</div><div class="flip-hint">Klick zum Umdrehen</div></div>
        <div class="vocab-back"><div class="vocab-translation">${v.translation}</div><div class="vocab-example">${v.example}</div></div>
      </div>
    </div>`).join('');
  c.innerHTML = `<div class="card"><div class="word-counter">Runde 1: <span>${VOCAB.length}</span> Begriffe — klicke die Karten um</div>
    <div class="vocab-grid">${gridHTML}</div>
    <div class="btn-row"><button class="btn-primary" onclick="startRound1()">Weiter zu Multiple Choice →</button></div></div>`;
}

function startRound1() {
  round = 1; mcOrder = fisher(VOCAB); mcIdx = 0; updateRoundDots();
  showMC();
}
function showMC() {
  if (mcIdx >= mcOrder.length) { startRound2(); return; }
  const v = mcOrder[mcIdx];
  const others = VOCAB.filter(x => x.word !== v.word);
  const wrong3 = fisher(others).slice(0,3).map(x => x.translation);
  const allChoices = fisher([v.translation, ...wrong3]);
  const correctIdx = allChoices.indexOf(v.translation);
  const c = document.getElementById('mainContainer');
  c.innerHTML = `<div class="card mc-card">
    <div class="word-counter">Frage <span>${mcIdx+1}</span> von <span>${mcOrder.length}</span></div>
    <div class="mc-emoji">${v.emoji}</div>
    <div class="mc-word">${v.word}</div>
    <div class="mc-question">Was bedeutet dieser Begriff?</div>
    <div class="mc-choices">${allChoices.map((ch,i) => `<button class="mc-btn" id="mcb${i}" onclick="checkMC(${i},${correctIdx})">${ch}</button>`).join('')}</div>
    <div class="mc-feedback" id="mcFeedback"></div>
    <div class="btn-row" id="mcNextRow" style="display:none"><button class="btn-primary" onclick="mcIdx++;showMC()">Nächster Begriff →</button></div>
  </div>`;
}
function checkMC(chosen, correct) {
  document.querySelectorAll('.mc-btn').forEach(b => b.disabled = true);
  const fb = document.getElementById('mcFeedback');
  if (chosen === correct) {
    document.getElementById('mcb'+chosen).classList.add('correct');
    fb.textContent = '✅ Richtig! +2 Punkte'; fb.className = 'mc-feedback c';
    updateScore(2); correctAnswers[mcOrder[mcIdx].word] = true;
  } else {
    document.getElementById('mcb'+chosen).classList.add('wrong');
    document.getElementById('mcb'+correct).classList.add('correct');
    fb.textContent = '❌ Nicht ganz — die richtige Antwort ist markiert.'; fb.className = 'mc-feedback w';
    correctAnswers[mcOrder[mcIdx].word] = false;
  }
  document.getElementById('mcNextRow').style.display = 'flex';
}

function startRound2() {
  round = 2; typOrder = fisher(VOCAB); typIdx = 0; updateRoundDots();
  showTyping();
}
function showTyping() {
  if (typIdx >= typOrder.length) { showResults(); return; }
  const v = typOrder[typIdx];
  const c = document.getElementById('mainContainer');
  c.innerHTML = `<div class="card">
    <div class="word-counter">Begriff <span>${typIdx+1}</span> von <span>${typOrder.length}</span> eintippen</div>
    <div class="typing-emoji">${v.emoji}</div>
    <div class="typing-word">${v.translation}</div>
    <div class="typing-example">${v.example}</div>
    <input class="typing-input" id="typInput" placeholder="Begriff eingeben…" autocomplete="off" autocorrect="off">
    <div class="typing-feedback" id="typFeedback"></div>
    <div class="btn-row"><button class="btn-primary" onclick="checkTyping('${v.word}')">Prüfen ↵</button></div>
  </div>`;
  const inp = document.getElementById('typInput');
  inp.focus();
  inp.addEventListener('keydown', e => { if(e.key==='Enter') checkTyping(v.word); });
}
function checkTyping(correct) {
  const inp = document.getElementById('typInput');
  const val = inp.value.trim().toLowerCase();
  const fb = document.getElementById('typFeedback');
  const dist = levenshtein(val, correct.toLowerCase());
  inp.disabled = true;
  let pts = 0;
  if (dist === 0) {
    inp.classList.add('correct'); fb.style.color='var(--green)'; fb.textContent='✅ Perfekt! +3 Punkte'; pts=3;
    typingResults.push({word:correct,ok:true});
  } else if (dist <= 1) {
    inp.classList.add('close'); fb.style.color='var(--yellow)'; fb.textContent=`⭐ Fast richtig (${correct}) +1 Punkt`; pts=1;
    typingResults.push({word:correct,ok:'close'});
  } else {
    inp.classList.add('wrong'); fb.style.color='var(--red)'; fb.textContent=`❌ Richtig: ${correct}`; pts=0;
    typingResults.push({word:correct,ok:false});
  }
  updateScore(pts);
  setTimeout(() => { typIdx++; showTyping(); }, 1500);
}

function showResults() {
  const maxScore = VOCAB.length * 2 + VOCAB.length * 3;
  const pct = Math.round((score / maxScore) * 100);
  const stars = pct >= 85 ? '🌟🌟🌟' : pct >= 60 ? '⭐⭐' : '⭐';
  document.getElementById('mainContainer').innerHTML = `<div class="card card-center">
    <span class="results-emoji">${stars}</span>
    <div class="results-score">${score} von ${maxScore} Punkten (${pct}%)</div>
    <div class="results-sub">Alle drei Runden abgeschlossen — gut gemacht!</div>
    <div class="btn-row">
      <button class="btn-primary" onclick="printSummary()">🖨️ Ausdruck</button>
      <button class="btn-secondary" onclick="if(confirm('Neu starten?')){score=0;document.getElementById(\'scoreBadge\').textContent=\'0 Pkt\';correctAnswers={};typingResults=[];startRound0();}">🔄 Neu starten</button>
    </div>
  </div>`;
}

function toggleTheme() {
  const h = document.documentElement; const d = h.getAttribute('data-theme')==='dark';
  h.setAttribute('data-theme', d?'light':'dark');
  document.getElementById('themeIcon').textContent = d?'☀️':'🌙';
}
function printSummary() {
  const now = new Date().toLocaleDateString('de-CH');
  const rows = VOCAB.map(v => `<tr><td style="padding:6px 10px">${v.emoji} ${v.word}</td><td style="padding:6px 10px">${v.translation}</td></tr>`).join('');
  document.getElementById('printContent').innerHTML = `<div style="font-family:Arial,sans-serif;max-width:680px;margin:0 auto;padding:30px;color:#111;">
    <h2>🃏 Vokabeltrainer — Lohn & Budget</h2>
    <p style="font-size:0.82rem;color:#666;margin-bottom:16px;">Datum: ${now} | Punkte: ${score}</p>
    <table style="width:100%;border-collapse:collapse;font-size:0.88rem;">
      <thead><tr style="background:#e2e8f0"><th style="padding:8px 10px;text-align:left">Begriff</th><th style="padding:8px 10px;text-align:left">Bedeutung</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  window.print();
}
startRound0();
</script>
</body>
</html>
